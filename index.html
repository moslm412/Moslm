<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6f0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <title>Mini touch</title>
  <script>
    window.__v = { index: "R6" }; // رقم إصدار هذا الملف (لا تغيّره)
    // إذا كان في أحد ملفات الجافاسكربت خطأ (مثل فاصلة ناقصة في products.js) يظهر شريط أحمر يدلّك على الملف والسطر
    window.addEventListener("error", function (e) {
      var f = (e.filename || "").split("/").pop().split("?")[0];
      if (!/\.js$/.test(f)) return;
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99;background:#b91c1c;color:#fff;padding:10px 14px;font:14px/1.6 sans-serif;direction:rtl;text-align:center";
      d.textContent = window.__jsErr = "خطأ في ملف " + f + " (سطر " + e.lineno + "): " + e.message;
      var add = function () { document.body.appendChild(d); };
      document.body ? add() : document.addEventListener("DOMContentLoaded", add);
    });
    // تحميل التصميم بدون تخزين مؤقت حتى تظهر تعديلاتك فوراً
    document.write('<link rel="stylesheet" href="styles.css?t=' + Date.now() + '">');
  </script>
</head>
<body>
  <div class="page">

    <!-- الشريط العلوي: السلة على اليمين -->
    <header class="topbar">
      <button class="cart-btn" id="cartBtn" aria-label="السلة">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1.4"/><circle cx="19" cy="21" r="1.4"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.5L22 7H6"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
      <div class="logo" id="logo">
        <span class="logo-badge" id="logoBadge">
          <svg viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l-1.5 9"/><path d="M8 12h16l-1.8 15a2 2 0 0 1-2 1.8h-8.4a2 2 0 0 1-2-1.8z"/><path d="M8.6 17h14.8"/><circle cx="13" cy="24" r=".9" fill="#fff"/><circle cx="17" cy="23.5" r=".9" fill="#fff"/><circle cx="20" cy="24.3" r=".9" fill="#fff"/></svg>
        </span>
        <span class="logo-text" id="logoText">Mini touch</span>
      </div>
      <button class="qr-btn" id="qrBtn" aria-label="رمز QR للموقع">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM19 14h2M14 19h2M18 18h3v3h-3z"/></svg>
        </button>
    </header>

    <!-- الصورة العلوية (تتحكم بها من products.js) -->
    <section class="hero" id="hero"></section>

    <!-- البحث -->
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="ابحث عن قطعة أثاث...">
    </div>

    <!-- التصنيفات -->
    <div class="chips" id="chips"></div>

    <h2 class="section-title" id="menu">الأثاث</h2>
    <main class="grid" id="products"></main>

    <footer class="footer">صُنع بحب ♥ · اطلب الآن عبر واتس اب</footer>
  </div>

  <!-- السلة -->
  <div class="overlay" id="overlay"></div>
  <aside class="sheet" id="drawer">
    <div class="grab"></div>
    <div class="sheet-head">
      <h2>سلة المشتريات</h2>
      <button id="closeCart" class="close" aria-label="إغلاق">✕</button>
    </div>
    <div class="sheet-body" id="cartItems"></div>
    <div class="sheet-foot">
      <div class="total"><span>المجموع</span><b id="cartTotal">0</b></div>
      <button class="wa-btn" id="waBtn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>
        انقر للشراء عبر واتس اب
      </button>
      <button class="clear-btn" id="clearBtn">تفريغ السلة</button>
    </div>
  </aside>

  <!-- نافذة رمز QR -->
  <div class="overlay" id="qrOverlay"></div>
  <div class="qr-modal" id="qrModal">
    <button class="close" id="qrClose" aria-label="إغلاق">✕</button>
    <h3 class="qr-title">امسح الرمز لفتح الموقع</h3>
    <div class="qr-box"><img id="qrImg" alt="QR"></div>
    <div class="qr-support"><span id="qrSupportLabel"></span> <bdi dir="ltr" id="qrPhone"></bdi></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ملفات الأسعار والمنطق تُحمَّل دائماً بأحدث نسخة (بدون تخزين مؤقت)، والصور والإعدادات الثقيلة تُخزَّن لسرعة الموقع
    (function () {
      var t = Date.now(), L = [["firebase-config.js", "R6"], ["images.js", "R6"], ["products.js", "t" + t], ["firebase-adapter.js", "R6"], ["app.js", "t" + t]];
      L.forEach(function (x) { document.write('<script src="' + x[0] + '?' + x[1] + '"><\/script>'); });
    })();
  </script>

  <script>
    // فحص تلقائي: إذا كان أحد الملفات قديماً أو غير مرفوع يظهر شريط برتقالي باسمه (يختفي عندما تكون كل الملفات صحيحة)
    window.addEventListener("load", function () {
      var need = { config: "firebase-config.js", images: "images.js", products: "products.js", adapter: "firebase-adapter.js", app: "app.js" }, bad = [];
      for (var k in need) if ((window.__v || {})[k] !== "R6") bad.push(need[k]);
      if (!bad.length) return;
      var w = document.createElement("div");
      w.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:98;background:#c2410c;color:#fff;padding:12px 14px;font:14px/1.6 sans-serif;direction:rtl;text-align:center";
      w.textContent = "ملفات قديمة أو غير مرفوعة: " + bad.join("، ") + " — ارفع نسخها الجديدة من الحزمة (اضغط هنا للإغلاق)";
      w.onclick = function () { w.remove(); }; document.body.appendChild(w);
    });
  </script>
</body>
</html>
